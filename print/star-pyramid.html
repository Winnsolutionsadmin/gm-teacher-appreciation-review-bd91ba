<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Star pyramid poster, color-in (print, 8.5x11) · Growing Mindfully</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600&family=Manrope:wght@500;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  @page{size:letter portrait;margin:0}
  :root{--paper:#FBF7EE;--ink:#1F2A2E;--ink2:#3F5359;--ink3:#6F7F84;--teal-deep:#3D8189;--gold:#C9A86A}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d3c4}
  body{font-family:'Manrope',sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px}
  .sheet{width:8.5in;height:11in;background:var(--paper);padding:.7in .6in .6in;display:flex;flex-direction:column;align-items:center;box-shadow:0 8px 30px rgba(31,42,46,.18);position:relative}
  .wordmark{width:2in;height:auto;margin-bottom:.2in}
  h1{font-family:'Caveat',cursive;font-weight:600;font-size:46px;color:var(--teal-deep);line-height:1;margin-bottom:.15in}
  svg{width:7.3in;height:auto;display:block}
  .foot{position:absolute;bottom:.4in;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  @media print{html,body{background:#fff}body{padding:0}.sheet{box-shadow:none}}
  @media (max-width:900px){.sheet{width:100%;height:auto;padding:6vw}svg{width:100%}.foot{position:static;margin-top:6vw}}
</style>
</head>
<body>
<!-- STAFF-ROOM VISUAL, no words addressed to staff: 25 outline stars to color in, one per review, with the five marks numbered. Whether it goes up, and any caption, is Jarred's call. Alternative to the physical jar. -->
<main class="sheet">
  <img class="wordmark" src="../assets/wordmark.png" alt="Growing Mindfully">
  <h1>the star board</h1>
  <svg viewBox="0 0 720 700" role="img" aria-label="Twenty-five outline stars arranged in a pyramid, rows of 1, 3, 5, 7 and 9, with marks at stars 1, 3, 5, 10 and 25">
    <defs>
      <path id="st" d="M0 -30 L8.8 -9.3 L31.5 -9.3 L13.1 4.3 L19.9 26 L0 13 L-19.9 26 L-13.1 4.3 L-31.5 -9.3 L-8.8 -9.3 Z"/>
    </defs>
    <g id="stars" fill="#fff" stroke="#C9A86A" stroke-width="3" stroke-linejoin="round"></g>
    <g id="marks" font-family="Manrope,sans-serif" font-size="13" font-weight="700" fill="#3D8189"></g>
  </svg>
  <div class="foot">750 N Street · one star per review</div>
</main>
<script>
(function(){
  // pyramid rows top to bottom: 1,3,5,7,9 = 25. Numbering runs top-down so star 1 sits at the peak.
  var rows=[1,3,5,7,9], gap=76, rowH=128, top=52, cx=360, n=0;
  var g=document.getElementById('stars'), m=document.getElementById('marks');
  var marks={1:'coffee',3:'Starbucks',5:'lunch',10:'catered',25:'grand prize'};
  rows.forEach(function(count,ri){
    var y=top+ri*rowH, startX=cx-((count-1)*gap)/2;
    for(var i=0;i<count;i++){ n++; var x=startX+i*gap;
      var u=document.createElementNS('http://www.w3.org/2000/svg','use'); u.setAttribute('href','#st'); u.setAttribute('x',x); u.setAttribute('y',y);
      if(marks[n]){u.setAttribute('stroke','#3D8189');u.setAttribute('stroke-width','4');}
      g.appendChild(u);
      var t=document.createElementNS('http://www.w3.org/2000/svg','text'); t.setAttribute('x',x); t.setAttribute('y',y+48); t.setAttribute('text-anchor','middle');
      t.setAttribute('fill',marks[n]?'#3D8189':'#9AA6AA'); t.setAttribute('font-size',marks[n]?'13':'11'); t.textContent=marks[n]?(n+' · '+marks[n]):n; m.appendChild(t);
    }
  });
})();
</script>
</body>
</html>
