<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Team Wheel · Growing Mindfully</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF7EE; --paper2:#F0E9D8; --ink:#1F2A2E; --ink2:#3F5359; --ink3:#6F7F84;
    --teal:#5FAEB6; --teal-deep:#3D8189; --sage:#9BB99E; --sage-deep:#6F8F70;
    --dusty:#7AA8C4; --dusty-deep:#4F7A99; --gold:#C9A86A; --blush:#E8C9B5; --r:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Manrope',sans-serif;background:var(--paper);color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;
       justify-content:center;padding:24px;gap:18px}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink3);font-weight:700}
  h1{font-family:'Newsreader',serif;font-weight:600;font-size:clamp(26px,5vw,38px);text-align:center}
  h1 em{font-family:'Caveat',cursive;font-style:normal;color:var(--teal-deep)}
  .stage{position:relative;width:min(78vw,420px);height:min(78vw,420px)}
  canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 24px rgba(31,42,46,.14))}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
           border-left:14px solid transparent;border-right:14px solid transparent;
           border-top:22px solid var(--ink);z-index:2}
  button{font-family:'Manrope',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;
         background:var(--teal-deep);color:#fff;border:none;border-radius:var(--r);
         padding:14px 42px;cursor:pointer;box-shadow:0 3px 12px rgba(61,129,137,.35);
         transition:transform .15s, box-shadow .15s}
  button:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(61,129,137,.4)}
  button:disabled{opacity:.55;cursor:default;transform:none}
  .result{min-height:64px;text-align:center}
  .result .won{font-family:'Caveat',cursive;font-size:clamp(24px,5vw,34px);color:var(--sage-deep)}
  .result .note{font-size:12.5px;color:var(--ink3);margin-top:2px}
  .foot{font-size:11px;color:var(--ink3);text-align:center;max-width:420px;line-height:1.5}
</style>
</head>
<body>
  <div class="kicker">Growing Mindfully · Team</div>
  <h1>The <em>Friday</em> Wheel</h1>
  <div class="stage">
    <div class="pointer"></div>
    <canvas id="wheel" width="840" height="840"></canvas>
  </div>
  <button id="spin">Spin</button>
  <div class="result" id="result"></div>
  <p class="foot">A small thank-you to the people who make this school what it is.
  Time prizes rotate one classroom at a time so every room stays covered.</p>

<script>
(function(){
  var prizes=[
    {t:"Starbucks run day", s:"Jarred fetches the orders", c:"#3D8189"},
    {t:"Ashley cooks lunch", s:"theme of the month", c:"#6F8F70"},
    {t:"Catered team lunch", s:"picked together", c:"#4F7A99"},
    {t:"Pastry + coffee morning", s:"early treat", c:"#C9A86A"},
    {t:"Jarred covers your room", s:"one hour, rotates", c:"#5FAEB6"},
    {t:"Early Friday", s:"30 min, staggered", c:"#9BB99E"},
    {t:"Team choice", s:"the team picks", c:"#7AA8C4"},
    {t:"Mystery treat", s:"Jarred improvises", c:"#E8C9B5"}
  ];
  var cv=document.getElementById('wheel'),cx=cv.getContext('2d');
  var N=prizes.length,TAU=Math.PI*2,seg=TAU/N,ang=0,spinning=false;
  function draw(a){
    cx.clearRect(0,0,840,840);cx.save();cx.translate(420,420);cx.rotate(a);
    for(var i=0;i<N;i++){
      cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,400,i*seg,(i+1)*seg);cx.closePath();
      cx.fillStyle=prizes[i].c;cx.fill();
      cx.strokeStyle="#FBF7EE";cx.lineWidth=5;cx.stroke();
      cx.save();cx.rotate(i*seg+seg/2);cx.textAlign="right";
      cx.fillStyle=(prizes[i].c==="#E8C9B5"||prizes[i].c==="#C9A86A")?"#1F2A2E":"#FBF7EE";
      cx.font="600 26px Manrope, sans-serif";cx.fillText(prizes[i].t,368,-6);
      cx.font="500 19px Manrope, sans-serif";cx.globalAlpha=.85;cx.fillText(prizes[i].s,368,20);
      cx.restore();
    }
    cx.beginPath();cx.arc(0,0,52,0,TAU);cx.fillStyle="#FBF7EE";cx.fill();
    cx.strokeStyle="#F0E9D8";cx.lineWidth=4;cx.stroke();
    cx.font="600 30px Caveat, cursive";cx.fillStyle="#3D8189";cx.textAlign="center";
    cx.fillText("thanks",0,10);cx.restore();
  }
  document.fonts?document.fonts.ready.then(function(){draw(ang)}):draw(ang);
  draw(ang);
  document.getElementById('spin').addEventListener('click',function(){
    if(spinning)return;spinning=true;this.disabled=true;
    document.getElementById('result').innerHTML="";
    var target=ang+TAU*(5+Math.random()*3)+Math.random()*TAU;
    var start=null,dur=5200,from=ang;
    function ease(t){return 1-Math.pow(1-t,4)}
    function step(ts){
      if(!start)start=ts;var p=Math.min((ts-start)/dur,1);
      ang=from+(target-from)*ease(p);draw(ang);
      if(p<1){requestAnimationFrame(step)}else{
        spinning=false;document.getElementById('spin').disabled=false;
        var norm=((-ang-Math.PI/2)%TAU+TAU)%TAU;
        var idx=Math.floor(norm/seg);
        var w=prizes[idx];
        document.getElementById('result').innerHTML=
          '<div class="won">'+w.t+'</div><div class="note">'+w.s+'</div>';
      }
    }
    requestAnimationFrame(step);
  });
})();
</script>
</body>
</html>
